name: Deploy PET_PROJECTS.TIMELINE to Ubuntu

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    uses: PET-PROJECTSS/PET_PROJECTS.ACTIONS/.github/workflows/deploy.yml@main
    with:
      project_path: /opt/projects/timeline
      service_name: PET_PROJECTS.TIMELINE
      repo_ssh_or_https: https://github.com/PET-PROJECTSS/PET_PROJECTS.TIMELINE.git
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
