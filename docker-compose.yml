services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-timeline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timeline} -d ${POSTGRES_DB:-timeline}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-timeline}
      TIMELINE_ADMIN_USER: ${TIMELINE_ADMIN_USER:-admin}
      TIMELINE_ADMIN_PASSWORD: ${TIMELINE_ADMIN_PASSWORD:?задайте TIMELINE_ADMIN_PASSWORD в .env}
      TIMELINE_OBSERVER_USER: ${TIMELINE_OBSERVER_USER:-observer}
      TIMELINE_OBSERVER_PASSWORD: ${TIMELINE_OBSERVER_PASSWORD:?задайте TIMELINE_OBSERVER_PASSWORD в .env}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
